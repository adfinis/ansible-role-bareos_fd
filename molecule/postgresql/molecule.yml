---

dependency:
  name: galaxy
  options:
    role-file: molecule/postgresql/requirements.yml
    requirements-file: molecule/postgresql/requirements.yml
driver:
  name: docker
platforms:
  - name: "bareosfd-${image:-ubuntu2604}${TOX_ENVNAME}"
    image: "geerlingguy/docker-${image:-ubuntu2604}-ansible:latest"
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "~/.ansible/roles:${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
